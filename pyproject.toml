[project]
name = "chemai-predict-the-cure-submit"
version = "0.1.0"
description = "Data Seven. Предсказание IC50, CC50, SI для химических соединений против вируса гриппа"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "lightgbm>=4.0",
    "xgboost>=2.0",
    "optuna>=4.8.0",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.uv]
package = false
